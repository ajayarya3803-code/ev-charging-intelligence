version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_vehicles
    columns:
      - name: vehicle_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: dim_stations
    columns:
      - name: station_id
        data_tests:
          - unique
          - not_null

  - name: fact_charging_sessions
    columns:
      - name: session_id
        data_tests:
          - unique
          - not_null

      - name: vehicle_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vehicles')
                field: vehicle_id

      - name: station_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id

  - name: fact_transactions
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null

      - name: session_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_charging_sessions')
                field: session_id